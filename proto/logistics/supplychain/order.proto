syntax = "proto3";
package logistics.supplychain;

option go_package = "logistics/x/supplychain/types";

message Order {
  uint64 id = 1;
  string orderId = 2; 
  string purchaseId = 3; 
  string seller = 4; 
  string buyer = 5; 
  string status = 6; 
  string items = 7; 
  string price = 8; 
  string timestamp = 9; 
  string creator = 10;
}
